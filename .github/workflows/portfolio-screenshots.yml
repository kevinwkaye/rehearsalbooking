name: Portfolio screenshots
on:
  push:
    branches: [portfolio-screenshot-captures]
    paths:
      - '.github/workflows/portfolio-screenshots.yml'
      - 'scripts/portfolio-capture.mjs'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app and browser
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build actual app for demo fixture screens
        env:
          VITE_SUPABASE_URL: https://portfolio.supabase.co
          VITE_SUPABASE_ANON_KEY: portfolio-demo-public-key
        run: npm run build
      - name: Capture public live and dummy-data portfolio screenshots
        run: node scripts/portfolio-capture.mjs
      - name: Upload downloadable portfolio screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 88-Bunkspace-portfolio-screenshots
          path: portfolio/screenshots/*.png
          if-no-files-found: warn
      - name: Save screenshots on this portfolio-only branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs(portfolio): render app screenshots from public pages and demo fixtures"
            git push
          fi
